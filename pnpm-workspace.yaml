# pnpm >= 10 blocks dependency build scripts by default, so a plain
# `pnpm install` leaves the Prisma engines unbuilt and every later
# `prisma generate` / `next build` fails. pnpm 12 reads this allow-list from
# pnpm-workspace.yaml under `allowBuilds` (the older `pnpm.onlyBuiltDependencies`
# field in package.json is ignored and only prints a warning).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
